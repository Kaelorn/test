const art=[['','Fall marks the beginning of the holiday season, with people everywhere booking plane tickets and planning to head home to their families for the holidays. Come November, many choose to reunite with relatives for Thanksgiving. But for those who can\'t—or who, um, don\'t want to—Friendsgiving has risen in popularity. You\'ve heard of it, right?'],
['What Does Friendsgiving Mean?','The world "Friendsgiving" was officially added to the Merriam-Webster dictionary in January 2020 after being on its "Words We\'re Watching" list. It\'s obviously a compound of the words "friends" and "Thanksgiving" and refers to an informal iteration of the holiday that has become super common. It\'s basically the day you celebrate Thanksgiving with your friends. Sometimes it\'s in lieu of having Thanksgiving with family, or in addition to it.'],
['When Did Friendsgiving Start?','According to Merriam-Webster, the earliest use of the term Friendsgiving dates back to a 2007 tweet, but some people credit the hit show Friends for inspiring the concept of spending the holiday with friends. Another theory suggests that a 2011 ad campaign by Baileys Irish Cream liqueur used the word, giving the Friendsgiving movement more momentum. Since then, it\'s become a word that refers to a Thanksgiving dinner celebrated with friends.'],
['What Day Do People Celebrate Friendsgiving?','There\'s no official date for Friendsgiving, like there is for Thanksgiving (which is celebrating on the fourth Thursday of November, by the way). Many people choose to host it before legit Turkey Day, if they spend Thanksgiving traveling home to be with family. Others will just co-opt the true Thanksgiving and call it Friendsgiving if they\'re celebrating with a group of pals.'],
['What\'s The Menu Like On Friendsgiving?','It\'s up to the host and attendees, but typically, the menu looks a lot like a classic Thanksgiving day menu. Potluck meals are popular, with everyone bringing something to share—like their favorite recipe or one that reminds them of home. It\'s also a chance for groups to try out some less traditional recipes, since grandma won\'t be there to ask why her version of pecan pie isn\'t on the table. Sometimes the centerpiece is a classic turkey, and sometimes there isn\'t a turkey at all.'],
['Are There Any Friendsgiving Traditions?','While the Thanksgiving season may evoke memories of familial traditions, you can always make your own traditions with those close to you who aren\'t related by blood; Friendsgiving is perfect for doing so. All it takes is some sort of delicious food on the table and a bunch of seats filled with people you love. If you need a nudge in the right direction, though, check out these Thanksgiving recipes and fun DIY decorations.']];

{n:'Lead-in: Guess the meaning',h:()=>`<p class="sec">Lead-in</p><div class="eq">FRIENDS + THANKSGIVING<br><em>= FRIENDSGIVING</em></div><div class="card">${ol(['What two words can you see in the word Friendsgiving?','What do you think it means?','Do you think it\'s a real holiday or just an informal gathering?','Why might people want to celebrate Thanksgiving with friends instead of family?','Do you think people need special occasions to get together with friends?'])}</div>${phr(['I guess it means…','It might be…','Perhaps people…','I think it\'s because…','In my opinion…'])}`},
{n:'Before you read',dk:1,h:()=>`<p class="sec">Reading</p><h1>What is Friendsgiving?</h1><p>Let's find out what Friendsgiving is, where the tradition came from and how people celebrate it.</p><p><a href="${U}" target="_blank" rel="noopener"><button class="pri" style="font-size:20px;padding:12px 28px">READ THE ARTICLE</button></a></p><div class="card art"><h1 style="font-size:36px;margin-bottom:.1em">What Is Friendsgiving And Where Did The Holiday Come From?</h1><p><i>Mark your calendars for the best holiday!</i><br>By Alexis Morillo</p>${art.map(a=>(a[0]?`<h2>${a[0]}</h2>`:'')+`<p>${a[1]}</p>`).join('')}<p style="font-size:16px"><a href="${U}" target="_blank" rel="noopener">Read the original article on Delish</a></p></div>`},
{n:'Reading for gist',h:()=>`<p class="sec">Reading</p><h1>What's the main idea?</h1><p>Read the article and choose the best summary.</p><div id="g">${[['A','The history of Thanksgiving and why it is America\'s most important holiday.'],['B','A modern tradition of celebrating Thanksgiving with friends and creating new social traditions.'],['C','The most popular recipes and dishes people prepare for Thanksgiving.']].map(([l,t])=>`<button class="opt pk${S.g===l?' on':''}" data-pick="g|${l}"><b>${l}.</b> ${t}</button>`).join('')}</div><button class="pri" data-act="chkg">CHECK ANSWER</button> <b id="gm"></b><div class="card" style="margin-top:20px"><h2>In one or two sentences, explain what Friendsgiving is.</h2>${ta('gist','',4)}<small>Try to explain it in your own words. Don't copy a sentence from the article.</small></div><div id="sa">${tg('#sa','Show sample answer')}<div class="rev card">Friendsgiving is an informal celebration where people get together with friends around Thanksgiving. They usually share food and spend time together.</div></div>`},
{n:'Reading for detail',h:()=>`<p class="sec">Reading</p><h1>True or false?</h1><p>Read the article again and decide whether the statements are TRUE or FALSE.</p><div class="card" id="tf">${tf.map((s,i)=>`<div class="row"><span>${i+1}. ${s}</span><span style="flex:none">${pk('t'+i,'T','TRUE',tfa[i])}${pk('t'+i,'F','FALSE',!tfa[i])}</span><div class="rev">${tfa[i]?'TRUE':'FALSE'} — ${tfx[i]}</div></div>`).join('')}</div>${tg('#tf','SHOW ANSWERS')}`},
{n:'Vocabulary: match the meaning',h:()=>{const m=S.m||{};const res=i=>S.mc&&m[i]!=null?(ord[m[i]]===i?' ok t':' bad t'):'';return`<p class="sec">Vocabulary</p><h1>Match the meaning</h1><p>Click an expression, then click its definition.</p><div class="card mt"><div>${terms.map((t,i)=>`<button data-act="mt:${i}" class="${S.sel===i?'sel':''}${res(i)}" style="margin:5px 0"><span class="bd" ${m[i]==null?'hidden':''}>${m[i]==null?'':L[m[i]]}</span>${i+1}. ${t}</button>`).join('')}</div><div>${ord.map((di,d)=>{const t=Object.keys(m).find(k=>m[k]===d);return`<button data-act="md:${d}" class="${t!=null?res(+t):''}" style="margin:5px 0"><span class="bd" ${t==null?'hidden':''}>${t==null?'':+t+1}</span>${L[d]}. ${defs[di]}</button>`}).join('')}</div></div><button class="pri" data-act="mchk">CHECK</button> <button data-act="mreset">TRY AGAIN</button> <button data-act="mshow">SHOW ANSWERS</button>`}},
{n:'Controlled practice',h:()=>`<p class="sec">Controlled practice</p><h1>Complete the sentences</h1><p>Complete the sentences using the phrases from the box. Change the form if necessary.</p><div class="card" style="text-align:center">reunite with (someone) • rise in popularity • in addition to • date back to • be up to (someone) • remind (someone) of (something) • potluck</div><div class="card gp">${gaps.map((s,i)=>{const v=(S['c'+i]||'');const c=S.c7?(gre[i].test(v.trim().toLowerCase())?' ok t':' bad t'):'';const [a,b]=s.split('___');return`<div>${i+1}. ${a}<input type="text" class="g${c}" data-k="c${i}" value="${esc(v)}" autocomplete="off" spellcheck="false">${b}${S.s7?` <span class="k">${gk[i]}</span>`:''}</div>`}).join('')}</div><button class="pri" data-act="c7chk">CHECK</button> <button data-act="c7reset">TRY AGAIN</button> <button data-act="c7show">SHOW ANSWERS</button>`},
{n:'Finish the sentences',h:()=>`<p class="sec">Semi-controlled practice</p><h1>Finish the sentences</h1><p>Complete the sentences with your own ideas. Choose 5–6 sentences and tell your teacher more.</p>${starts.map((s,i)=>`<div class="card" style="padding:12px 22px"><b>${s}</b>${ta('f'+i,'',2)}</div>`).join('')}`},
{n:'Agree or disagree?',dk:1,h:()=>`<p class="sec">Speaking</p><h1>Agree or disagree?</h1><p>Read the statements. Do you agree or disagree? Explain your opinion and give examples.</p>${phr(['I see your point, but…','I partly agree because…','It depends on…','From my point of view…','One reason for this is…','I would argue that…'])}${mkpick(agree,'a')}`},
{n:'This or that?',h:()=>`<p class="sec">Speaking</p><h1>This or that? Social traditions edition</h1><p>Choose one option and explain your choice. You can also say IT DEPENDS.</p>${tt.map((p,i)=>`<div class="card"><div class="ab">${pk('o'+i,'A','A. '+p[0])}<b>or</b>${pk('o'+i,'B','B. '+p[1])}</div><div style="margin-top:8px">${pk('o'+i,'X','IT DEPENDS')}</div>${ta('ot'+i,'Why? Explain your choice…',2)}</div>`).join('')}`},
{n:'Create your own tradition',dk:1,h:()=>`<p class="sec">Creative speaking</p><h1>Create your own tradition!</h1><p>Imagine you could create a new tradition for yourself and your friends. What would it be like? It doesn't have to be a big party or a holiday. It could be something small that you do regularly with a few close friends.</p><div class="card">${ol(['What would you call your tradition?','When would you celebrate it?','Who would you invite?','What would you usually do?','Would everyone bring something to share?','Would you have any special activities?','Why would people enjoy it?','Do you think it could rise in popularity?'])}</div>${det('IDEA BANK',ideas.map(i=>`<details><summary>${i[0]}</summary><div>${i[1]}</div></details>`).join('')+det('More ideas',ul(['What about a yearly movie marathon?','What about a no-phones evening?','What about a book or music exchange?','What about a mystery dinner where everyone brings a surprise dish?'])))}<div class="card"><b>Vocabulary reminder:</b> reunite with • rise in popularity • in addition to • date back to • be up to • remind someone of • potluck<br><br><b>Tell your teacher about your new tradition. Try to use at least THREE expressions from today's vocabulary.</b>${ta('trad','Notes (optional)…',3)}</div>`},
{n:'Extra: thank-you note',h:()=>`<p class="sec">Extra / Homework</p><h1>A little thank-you note</h1><p>Write a short thank-you message to someone who makes your life better. Imagine you want to thank a friend for being there for you. Write a short message (60–80 words).</p><div class="card">${ta('note','Dear…',8)}<p><span id="wc"></span> <button data-act="copy">COPY TEXT</button></p></div>${det('Useful language',ul(['I\'m really grateful for…','I appreciate the fact that…','I\'m glad we…','You always remind me of…','Thank you for always being there.','I\'m lucky to have you in my life.']))}<p style="font-size:17px">You can mention: why you appreciate this person; a special memory you share; something they remind you of; why you feel close to them; why you\'re glad to have them in your life.</p>`}
];
const T=['<b>5 min.</b> Activate schema. Don\'t correct heavily; collect ideas. Hints are optional vocabulary only.<br><b>Challenge (B1+):</b> ask for comparisons — family vs. friends celebrations.','<b>5 min.</b> Elicit predictions BEFORE reading. Students guess the meaning from the compound word.<br><b>Follow-ups:</b> Why do you think so? Could a new word become "official"?','<b>7–10 min.</b> Student reads in the file; the Delish link opens in a new tab.<br>Don\'t pre-teach all vocabulary; target items come in the vocabulary stage.','<b>5 min. Key: B.</b> A = history of Thanksgiving only; C = recipes only; neither is the focus.<br>Sample answer is under "Show sample answer". Praise paraphrasing.<br><b>B1+:</b> ask for a 3-sentence summary.','<b>5 min. Key:</b> 1 T, 2 F, 3 F, 4 F, 5 T, 6 F, 7 T. Explanations appear with SHOW ANSWERS.<br><b>B1+:</b> ask students to correct the false statements.','<b>7 min. Key:</b> 1-F, 2-B, 3-D, 4-A, 5-G, 6-C, 7-E (letters refer to the shuffled definitions on screen). Ask for example sentences after checking.','<b>8 min. Key:</b> 1 risen in popularity; 2 In addition to; 3 dates back to; 4 potluck; 5 up to; 6 reunite with; 7 remind me of (the original key says "reminds me of", but after "can" the base form is correct; the check accepts remind me/us/people/you of).<br><b>B1+:</b> write an extra sentence for each phrase.','<b>8 min.</b> Student chooses 5–6 sentences. Free production: don\'t correct during writing.<br><b>Follow-ups:</b> Can you give me an example? Why do you think so? Has it always been this way? Would you like to change anything? How often do you do this? Who would you usually do this with?','<b>10 min.</b> Focus on arguments, not accuracy.<br><b>Follow-ups:</b> Why do you think so? Can you think of an example? Has your opinion changed over time? Do you think everyone would agree with you? What could be a disadvantage of this?','<b>7 min.</b> Choice + reasons.<br><b>Follow-ups:</b> Why would you choose this? Have you ever tried the other option? What would make you change your mind? Would your friends choose the same option? What are the advantages of your choice?','<b>10 min.</b> Final free-practice task. Student should use at least 3 target phrases. Open the Idea Bank only if they freeze. Note errors for delayed feedback.','<b>Homework (optional).</b> 60–80 words; word counter and copy button included. Give feedback on content first, then language.'];
const G='<h3>Lesson overview</h3>Aim: read about Friendsgiving, learn 7 high-frequency chunks, then use them in speaking. Level B1–B1+. Total ≈ 65–75 min (lead-in 10, reading 20, vocabulary 15, semi-controlled 8, speaking 17–20).<br>Answers stay saved in this browser when pages change.<hr>';
const m=document.getElementById('m'),sel=document.getElementById('sel'),tn=document.getElementById('tn');
let cur=Math.min(Math.max(S.p|0,0),P.length-1);
P.forEach((p,i)=>sel.add(new Option((i+1)+'. '+p.n,i)));
function wc(){const e=document.getElementById('wc');if(e){const n=(S.note||'').trim().split(/\s+/).filter(Boolean).length;e.textContent=n+' words (aim for 60–80)'}}
function render(){m.innerHTML=P[cur].h();document.body.classList.toggle('dk',!!P[cur].dk);sel.value=cur;document.getElementById('pr').style.width=((cur+1)/P.length*100)+'%';document.getElementById('ct').textContent=(cur+1)+' / '+P.length;document.getElementById('pv').disabled=cur==0;document.getElementById('nx').disabled=cur==P.length-1;tn.innerHTML='<button data-act="tnx" style="float:right">Close</button>'+G+'<h3>'+(cur+1)+'. '+P[cur].n+'</h3>'+T[cur];wc();window.scrollTo(0,0)}
function go(i){cur=Math.max(0,Math.min(P.length-1,i));S.p=cur;save();render()}
const rr=()=>{const y=scrollY;render();scrollTo(0,y)};
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(k){S[k]=e.target.value;save();if(k==='note')wc()}});
document.addEventListener('click',e=>{
const pb=e.target.closest('[data-pick]');if(pb){const[k,v]=pb.dataset.pick.split('|');S[k]=S[k]===v?'':v;save();document.querySelectorAll(`[data-pick^="${k}|"]`).forEach(b=>b.classList.remove('on','ok','bad'));if(S[k])pb.classList.add('on');return}
const a=e.target.closest('[data-act]');if(!a)return;const[x,y]=a.dataset.act.split(':');
if(x==='tog')document.querySelector(y).classList.toggle('show');
else if(x==='chkg'){const mm=document.getElementById('gm');document.querySelectorAll('#g .opt').forEach(b=>b.classList.remove('ok','bad'));const b=document.querySelector('#g .on');if(!b){mm.textContent='Choose an answer first.';return}if(S.g==='B'){b.classList.add('ok');mm.textContent='Correct!'}else{b.classList.add('bad');mm.textContent='Not quite. Read again and try another option.'}}
else if(x==='mt'){S.sel=+y;rr()}
else if(x==='md'){if(S.sel==null)return;S.m=S.m||{};for(const k in S.m)if(S.m[k]===+y)delete S.m[k];S.m[S.sel]=+y;S.sel=null;S.mc=false;save();rr()}
else if(x==='mchk'){S.mc=true;save();rr()}
else if(x==='mreset'){S.m={};S.mc=false;S.sel=null;save();rr()}
else if(x==='mshow'){S.m={};ord.forEach((di,d)=>S.m[di]=d);S.mc=true;save();rr()}
else if(x==='c7chk'){S.c7=true;save();rr()}
else if(x==='c7reset'){gaps.forEach((_,i)=>S['c'+i]='');S.c7=false;S.s7=false;save();rr()}
else if(x==='c7show'){S.s7=true;save();rr()}
else if(x==='copy'){const t=S.note||'';(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const q=document.querySelector('[data-k=note]');q.select();document.execCommand('copy')});a.textContent='COPIED'}
else if(x==='tnx')tn.classList.remove('open');
});
document.getElementById('tb').onclick=()=>tn.classList.toggle('open');
document.getElementById('pv').onclick=()=>go(cur-1);document.getElementById('nx').onclick=()=>go(cur+1);
sel.onchange=()=>go(+sel.value);
document.addEventListener('keydown',e=>{if(/TEXTAREA|INPUT|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
render();
</script></body></html>
